alerts:
  - name: HighLatencyP95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: dashboard-team
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: dashboard-team
    runbook: docs/alerts.md#alert-2
  - name: DailyCostBudgetBreach
    severity: warning
    condition: daily_cost_usd > 2.5 for 15m
    type: symptom-based
    owner: dashboard-team
    runbook: docs/alerts.md#alert-3
